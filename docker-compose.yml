services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ega-portal
    restart: unless-stopped
    ports:
      # Bind to 127.0.0.1 so the port is only accessible via CloudPanel reverse proxy
      - "127.0.0.1:3000:3000"
    env_file:
      - .env
    environment:
      - PORT=3000
      - HOSTNAME=0.0.0.0
    volumes:
      # Persist user uploads across container rebuilds
      - uploads_data:/app/public/uploads

volumes:
  uploads_data:
    driver: local
